environment: dev
region: us-east-1

# SSM Parameter Store — non-sensitive configuration values only.
# For secrets and credentials, use AWS Secrets Manager.

ssm:
  parameters:

    # Basic String — no optional fields
    - name: /myapp/db/host
      type: String
      value: db.dev.example.com
      description: "Database hostname for dev environment"
      tier: Standard

    # String with tags — for cost allocation and governance
    - name: /myapp/db/port
      type: String
      value: "5432"
      description: "Database port"
      tier: Standard
      tags:
        team: platform
        environment: dev

    - name: /myapp/db/name
      type: String
      value: myapp_dev
      description: "Database name"
      tier: Standard
      tags:
        team: platform
        environment: dev

    # allowed_pattern — validates value matches a regex at creation time.
    # This enforces "host:port" format at deploy time, not just at runtime.
    - name: /myapp/cache/endpoint
      type: String
      value: redis.dev.example.com:6379
      description: "Redis cache endpoint (host:port)"
      tier: Standard
      allowed_pattern: "^[a-zA-Z0-9._-]+:[0-9]{1,5}$"
      tags:
        team: platform

    # data_type: aws:ec2:image — AWS validates this is a real AMI ID in the region.
    # The AMI is resolved to a specific ID at parameter read time.
    - name: /myapp/infra/base-ami
      type: String
      value: ami-0abcdef1234567890
      description: "Base AMI for EC2 instances"
      tier: Standard
      data_type: aws:ec2:image
      tags:
        team: infra

    # StringList — values are stored as comma-separated; returned as list by SDK.
    # Tags are supported; allowed_pattern and data_type are not.
    - name: /myapp/db/allowed-envs
      type: StringList
      value:
        - dev
        - staging
        - prod
      description: "Allowed deployment environments"
      tier: Standard
      tags:
        team: platform
        environment: dev

    - name: /myapp/api/base-url
      type: String
      value: https://api.dev.example.com
      description: "Base URL for the API"
      tier: Standard
      allowed_pattern: "^https://.+"
      tags:
        team: backend
        environment: dev
