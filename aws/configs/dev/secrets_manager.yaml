environment: dev
region: us-east-1

# AWS Secrets Manager — sensitive credentials and secrets only.
# For non-sensitive configuration values, use SSM Parameter Store.
#
# No actual secret value should ever be committed to version control.
# Use one of the four strategies below:
#
#   Generated  — AWS auto-generates a strong random value at deploy time.
#   Reference  — Secret pre-exists in AWS; CDK registers a reference only.
#   PlainText  — Single string; use ${VAR} to inject from env at synth time.
#   KeyValue   — JSON object; each value may use ${VAR} tokens.

secrets_manager:
  secrets:

    # ── Generated — AWS creates a cryptographically strong random value ───
    # Simple generated password.
    - name: /myapp/db/password
      type: Generated
      description: "Auto-generated database password"
      removal_policy: RETAIN              # keep secret even if stack is destroyed
      tags:
        team: platform
        environment: dev
      generate:
        length: 32
        exclude_characters: "/@\"' "      # prevent chars that break connection strings

    # Generated with full SecretStringGenerator fields.
    # secret_string_template + generate_string_key produce a JSON secret
    # compatible with RDS/Aurora automatic rotation:
    #   {"username": "admin", "password": "<generated>"}
    - name: /myapp/db/rds-credentials
      type: Generated
      description: "RDS credentials — rotation-compatible JSON secret"
      removal_policy: RETAIN
      tags:
        team: platform
      generate:
        length: 32
        exclude_characters: "/@\"'"
        exclude_punctuation: false
        include_space: false
        require_each_included_type: true  # ensures uppercase + lowercase + digit + symbol
        secret_string_template: '{"username": "admin"}'
        generate_string_key: "password"

    # Generated JWT signing key with full quality controls.
    - name: /myapp/auth/jwt-signing-key
      type: Generated
      description: "Auto-generated JWT signing key"
      tags:
        team: auth
      generate:
        length: 64
        exclude_punctuation: false
        require_each_included_type: true

    # ── Generated with KMS encryption ─────────────────────────────────────
    # Uses a customer-managed KMS key instead of the default AWS-managed key.
    # Required for HIPAA, PCI-DSS, and other compliance frameworks.
    - name: /myapp/payment/stripe-webhook-secret
      type: Generated
      description: "Stripe webhook signing secret — customer KMS encrypted"
      removal_policy: RETAIN
      kms_key_arn: arn:aws:kms:us-east-1:123456789012:key/mrk-abcdef1234567890
      tags:
        team: payment
        compliance: pci-dss
      generate:
        length: 32

    # ── Generated with cross-region replication ────────────────────────────
    # Secret is replicated to us-west-2 for DR / multi-region applications.
    - name: /myapp/auth/session-encryption-key
      type: Generated
      description: "Session encryption key — replicated to DR region"
      removal_policy: RETAIN
      replica_regions:
        - us-west-2
      tags:
        team: platform
        dr: enabled
      generate:
        length: 32

    # ── Reference — secret already exists, managed externally ─────────────
    - name: /myapp/legacy/api-key
      type: Reference
      description: "Pre-existing API key managed externally"

    # ── PlainText — single string injected from CI/CD env var ─────────────
    # Set before synth: export THIRD_PARTY_TOKEN=<value>
    - name: /myapp/api/third-party-token
      type: PlainText
      value: ${THIRD_PARTY_TOKEN}
      description: "Third-party API token (injected from CI/CD env var)"
      removal_policy: RETAIN
      tags:
        team: backend

    # ── KeyValue — JSON object with env-injected values ───────────────────
    # Set before synth: export DB_USER=myuser && export DB_NAME=myapp_dev
    - name: /myapp/db/connection
      type: KeyValue
      value:
        username: ${DB_USER}
        dbname: ${DB_NAME}
        host: db.dev.example.com
        port: "5432"
      description: "Database connection details (credentials injected from env)"
      removal_policy: RETAIN
      tags:
        team: platform
        environment: dev
