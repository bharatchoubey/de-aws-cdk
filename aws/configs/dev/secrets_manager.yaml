environment: dev
region: us-east-1

# AWS Secrets Manager — sensitive credentials and secrets only.
# For non-sensitive configuration values, use SSM Parameter Store.
#
# Four secret strategies are supported. No actual secret value should
# ever be committed to version control:
#
#   Generated  — AWS auto-generates a strong random value at deploy time.
#   Reference  — Secret pre-exists in AWS; CDK registers a reference only.
#   PlainText  — Single string; use ${VAR} to inject from env at synth time.
#   KeyValue   — JSON object; each value may use ${VAR} tokens.

secrets_manager:
  secrets:

    # Generated — AWS creates a cryptographically strong random password.
    # No value is ever written to config, code, or CI/CD.
    - name: /myapp/db/password
      type: Generated
      description: "Auto-generated database password"
      generate:
        length: 32
        exclude_characters: "/@\"' "   # prevent chars that break connection strings

    # Generated — signing key with default length (32 chars)
    - name: /myapp/auth/jwt-signing-key
      type: Generated
      description: "Auto-generated JWT signing key"
      generate:
        length: 64
        exclude_punctuation: false

    # Reference — secret already exists in AWS, managed by another team/tool.
    # CDK registers an ISecret reference for IAM wiring; value is untouched.
    - name: /myapp/legacy/api-key
      type: Reference
      description: "Pre-existing API key managed externally"

    # PlainText — value injected from CI/CD environment variable at synth time.
    # Set the env var before running: export THIRD_PARTY_TOKEN=<value>
    - name: /myapp/api/third-party-token
      type: PlainText
      value: ${THIRD_PARTY_TOKEN}
      description: "Third-party API token (injected from CI/CD env var)"

    # KeyValue — JSON object; individual keys injected from env vars.
    # Set before running: export DB_USER=myuser && export DB_NAME=myapp_dev
    - name: /myapp/db/connection
      type: KeyValue
      value:
        username: ${DB_USER}
        dbname: ${DB_NAME}
        host: db.dev.example.com
        port: "5432"
      description: "Database connection details (credentials injected from env)"
